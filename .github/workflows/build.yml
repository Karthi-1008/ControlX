name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [gba-tv-player, pocket-pad-controller]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK (required for gba-tv-player only)
        if: matrix.module == 'gba-tv-player'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :${{ matrix.module }}:app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-debug-apk
          path: ${{ matrix.module }}/app/build/outputs/apk/debug/*.apk
